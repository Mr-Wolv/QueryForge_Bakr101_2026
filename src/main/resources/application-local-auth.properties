# Authenticated local Compose profile.  Unlike the default development profile,
# this profile uses the real OAuth2 login/session/CSRF filter chain.
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m

spring.security.oauth2.client.registration.queryforge.provider=queryforge
spring.security.oauth2.client.registration.queryforge.client-id=queryforge-local
spring.security.oauth2.client.registration.queryforge.client-secret=${QF_OIDC_CLIENT_SECRET_FILE:/run/secrets/qf_oidc_client_secret}
spring.security.oauth2.client.registration.queryforge.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.queryforge.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.queryforge.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.queryforge.scope=openid,profile,email

# Browser-facing endpoints use the frontend reverse proxy.  Token, user-info and
# JWK calls ALSO go through the frontend proxy (not the raw `keycloak` service):
# its /id/ block injects X-Forwarded-Host=localhost:8080, so Keycloak issues and
# validates tokens against one consistent issuer.  Calling `keycloak` directly
# sends no forwarded headers, and userinfo then rejects the token with 401.
spring.security.oauth2.client.provider.queryforge.authorization-uri=http://localhost:${QF_WEB_PORT:8080}/id/realms/queryforge/protocol/openid-connect/auth
spring.security.oauth2.client.provider.queryforge.token-uri=http://frontend/id/realms/queryforge/protocol/openid-connect/token
spring.security.oauth2.client.provider.queryforge.user-info-uri=http://frontend/id/realms/queryforge/protocol/openid-connect/userinfo
# JWK set is REQUIRED to verify the ID-token signature.  When the provider
# endpoints are specified by hand, Spring does not derive it from the issuer,
# so omitting it fails the callback with [missing_signature_verifier].
spring.security.oauth2.client.provider.queryforge.jwk-set-uri=http://frontend/id/realms/queryforge/protocol/openid-connect/certs
spring.security.oauth2.client.provider.queryforge.user-name-attribute=sub

queryforge.auth.enabled=true
queryforge.auth.group-claim=groups
queryforge.auth.operator-groups=benchmark-operators

# Expose the actuator surface (health + Prometheus) on the container port the
# Compose monitoring stack scrapes (backend:8081 -> 8080).  Details stay hidden
# from unauthenticated callers; the Prometheus scrape is explicitly permitted.
management.server.port=8081
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
