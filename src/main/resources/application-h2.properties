# H2 runtime profile — local development without PostgreSQL
spring.datasource.url=jdbc:h2:mem:queryforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Disable PostgreSQL-specific configs when running on H2
management.prometheus.metrics.export.enabled=false
