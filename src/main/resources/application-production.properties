spring.config.import=optional:configtree:/run/secrets/
spring.datasource.username=queryforge_app
spring.datasource.password=${db-password}
spring.jpa.hibernate.ddl-auto=validate

server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=__Host-QUERYFORGE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m

spring.security.oauth2.client.registration.queryforge.provider=queryforge
spring.security.oauth2.client.registration.queryforge.client-id=${QF_OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.queryforge.client-secret=${oidc-client-secret}
spring.security.oauth2.client.registration.queryforge.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.queryforge.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.queryforge.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.queryforge.scope=openid,profile,email
spring.security.oauth2.client.provider.queryforge.issuer-uri=${QF_OIDC_ISSUER_URI}

queryforge.auth.enabled=true
queryforge.auth.group-claim=${QF_OIDC_GROUP_CLAIM:groups}
queryforge.auth.operator-groups=${QF_OIDC_OPERATOR_GROUPS:}

management.server.port=8081
management.endpoints.web.exposure.include=health,metrics,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
