spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/queryforge}
spring.datasource.username=${DB_USER:queryforge}
spring.datasource.password=${DB_PASSWORD:queryforge}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning for benchmark concurrency (k6 uses up to 50 VUs).
# Default pool of 10 connections is too small for concurrent benchmark runs.
spring.datasource.hikari.maximumPoolSize=25
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.locations=filesystem:./db/flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Product schema initialized outside Flyway
spring.flyway.validate-on-migrate=true
queryforge.runner.base-url=${QF_RUNNER_BASE_URL:http://127.0.0.1:8080}

server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}

management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
