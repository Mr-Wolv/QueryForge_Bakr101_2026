global:
  smtp_smarthost: mailpit:1025
  smtp_from: queryforge@localhost
  smtp_require_tls: false

route:
  receiver: local-email
  group_by: [alertname]
  # Local sink: keep waits short so delivery (and recovery) is observable
  # during a hands-on check.
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: local-email
    email_configs:
      - to: operations@queryforge.local
        send_resolved: true
