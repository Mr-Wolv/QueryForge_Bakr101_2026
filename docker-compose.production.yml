services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queryforge
      POSTGRES_USER: queryforge_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - queryforge_app_password
      - queryforge_monitor_password
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    volumes:
      - production_pgdata:/var/lib/postgresql/data
      - ./db/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./db/migrations/V1__create_products.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/init/03-create-app-roles.sh:/docker-entrypoint-initdb.d/03-create-app-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryforge_admin -d queryforge"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://db:5432/queryforge
      DB_USER: queryforge_app
      QF_OIDC_CLIENT_ID: ${QF_OIDC_CLIENT_ID:?Set QF_OIDC_CLIENT_ID}
      QF_OIDC_ISSUER_URI: ${QF_OIDC_ISSUER_URI:?Set QF_OIDC_ISSUER_URI}
      QF_OIDC_GROUP_CLAIM: ${QF_OIDC_GROUP_CLAIM:-groups}
      QF_OIDC_OPERATOR_GROUPS: ${QF_OIDC_OPERATOR_GROUPS:-}
      QF_RATE_LIMIT_REQUESTS_PER_MINUTE: ${QF_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      QF_RATE_LIMIT_ENABLED: ${QF_RATE_LIMIT_ENABLED:-true}
    secrets:
      - source: queryforge_app_password
        target: db-password
      - source: oidc_client_secret
        target: oidc-client-secret
    expose:
      - "8080"
      - "8081"
    volumes:
      - production_results:/app/benchmark/results
      - production_runs:/app/benchmark/runs
      - ./docs/experiments:/app/docs/experiments:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    networks:
      - database
      - web
      - observability

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - web

  edge:
    image: caddy:2.10-alpine
    environment:
      QF_DOMAIN: ${QF_DOMAIN:?Set QF_DOMAIN to a DNS name pointing at this host}
      QF_ACME_EMAIL: ${QF_ACME_EMAIL:?Set QF_ACME_EMAIL for certificate notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 0.5
    networks:
      - web

  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/workspace/scripts/backup-loop.sh"]
    environment:
      BACKUP_INTERVAL_SECONDS: ${QF_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${QF_BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIRECTORY: /backups
    secrets:
      - queryforge_app_password
    volumes:
      - ./scripts/backup-loop.sh:/workspace/scripts/backup-loop.sh:ro
      - production_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    networks:
      - database

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/queryforge?sslmode=disable
      DATA_SOURCE_USER: queryforge_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/queryforge_monitor_password
    secrets:
      - queryforge_monitor_password
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    networks:
      - database
      - observability

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - postgres-exporter
      - alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    networks:
      - observability

  alertmanager:
    build:
      context: .
      dockerfile: monitoring/Dockerfile.alertmanager
    environment:
      QF_SMTP_HOST: ${QF_SMTP_HOST:?Set QF_SMTP_HOST, e.g. smtp.example.com:587}
      QF_SMTP_FROM: ${QF_SMTP_FROM:?Set QF_SMTP_FROM}
      QF_SMTP_USERNAME: ${QF_SMTP_USERNAME:?Set QF_SMTP_USERNAME}
      QF_ALERT_EMAIL: ${QF_ALERT_EMAIL:?Set QF_ALERT_EMAIL}
    secrets:
      - source: smtp_password
        target: smtp_password
    volumes:
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    networks:
      - observability

volumes:
  production_pgdata:
  production_results:
  production_runs:
  production_backups:
  prometheus_data:
  alertmanager_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_admin_password:
    file: ${QF_POSTGRES_ADMIN_PASSWORD_FILE:?Set QF_POSTGRES_ADMIN_PASSWORD_FILE}
  queryforge_app_password:
    file: ${QF_APP_DB_PASSWORD_FILE:?Set QF_APP_DB_PASSWORD_FILE}
  queryforge_monitor_password:
    file: ${QF_MONITOR_DB_PASSWORD_FILE:?Set QF_MONITOR_DB_PASSWORD_FILE}
  oidc_client_secret:
    file: ${QF_OIDC_CLIENT_SECRET_FILE:?Set QF_OIDC_CLIENT_SECRET_FILE}
  smtp_password:
    file: ${QF_SMTP_PASSWORD_FILE:?Set QF_SMTP_PASSWORD_FILE}

networks:
  database:
    internal: true
  web:
  observability:
    internal: true
