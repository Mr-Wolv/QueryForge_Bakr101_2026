# Local development only. QF_DB_PASSWORD and QF_KEYCLOAK_ADMIN_PASSWORD MUST be set before starting.
services:
  db:
    image: postgres@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_DB: queryforge
      POSTGRES_USER: queryforge
      POSTGRES_PASSWORD: ${QF_DB_PASSWORD}
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    ports:
      - "127.0.0.1:${QF_DB_PORT:-}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./db/migrations/V1__create_products.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/migrations:/workspace/db/migrations:ro
      - ./benchmark/seed:/seed:ro
      - ./scripts:/workspace/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryforge -d queryforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Backend API
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Set QF_SPRING_PROFILE=local-auth for the authenticated local stack.
      # The default remains the explicit, visibly documented development bypass.
      SPRING_PROFILES_ACTIVE: ${QF_SPRING_PROFILE:-default}
      DB_URL: jdbc:postgresql://db:5432/queryforge
      DB_USER: queryforge
      DB_PASSWORD: ${QF_DB_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      QF_WEB_PORT: ${QF_WEB_PORT:-8080}
    ports:
      - "127.0.0.1:${QF_API_PORT:-8081}:8080"
    volumes:
      - ./benchmark/results:/app/benchmark/results
      - ./benchmark/runs:/app/benchmark/runs
      - ./docs/experiments:/app/docs/experiments:ro
    secrets:
      - qf_oidc_client_secret
    healthcheck:
      # The runtime image has no curl/wget; bash /dev/tcp verifies the app port
      # (the actuator lives on 8081 inside the container). /api/auth/session is
      # permitted in both the development and authenticated local profiles.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/auth/session HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  # Frontend (Angular + nginx)
  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${QF_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Included only in the authenticated local environment. The imported realm is
  # versioned and contains deliberately local-only viewer/operator credentials.
  keycloak:
    profiles: ["authenticated"]
    image: quay.io/keycloak/keycloak@sha256:32d2eb0f84aaf85b3e3afef544d5b25fcd40a791d62374f327a0cb5ca9aa1da5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${QF_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${QF_KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      # Keycloak is exposed browser-side under the /id/ path (same-origin with the SPA).
      # Tell it its relative path so every browser-facing URL keeps the /id/ prefix;
      # otherwise the login form posts to /realms/... and nginx returns 405.
      KC_HTTP_RELATIVE_PATH: /id/
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/queryforge-realm.json:/opt/keycloak/data/import/queryforge-realm.json:ro
      - keycloakdata:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /id/health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Local SMTP capture UI; it never relays mail beyond this Compose network.
  mailpit:
    profiles: ["monitoring"]
    image: axllent/mailpit@sha256:cc7251d2f55ca5271a4015012e1075ea7e6391120cca626362d8f5b747de2c49
    ports:
      - "127.0.0.1:${QF_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PostgreSQL metrics exporter. Needs a scrape target that actually exists;
  # the previous Prometheus config referenced a service that was never defined.
  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter@sha256:9fca39a4307092387b7de884bed4b62205cb88a6a5fdb423b9a70ea80b34efb3
    environment:
      DATA_SOURCE_URI: db:5432/queryforge?sslmode=disable
      DATA_SOURCE_USER: queryforge
      DATA_SOURCE_PASS: ${QF_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${QF_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      alertmanager:
        condition: service_started

  alertmanager:
    profiles: ["monitoring"]
    image: quay.io/prometheus/alertmanager@sha256:220da6995a919b9ee6e0d3da7ca5f09802f3088007af56be22160314d2485b54
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.local.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${QF_ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      mailpit:
        condition: service_healthy

  data-generator:
    profiles: ["tools"]
    image: python@sha256:aaf08c5490d52cd92bc27142a5215b1e47355a5eaf9adfad2a0fbc022d0b5490
    working_dir: /workspace
    entrypoint: ["python", "scripts/generate-data.py"]
    command: ["10000", "--csv", "benchmark/seed/products_seed42.csv"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./benchmark/seed:/workspace/benchmark/seed

volumes:
  pgdata:
  keycloakdata:
  prometheus_data:
  alertmanager_data:

secrets:
  qf_oidc_client_secret:
    file: ./secrets/qf_oidc_client_secret.txt
