# Local development only. Set QF_DB_PASSWORD to a strong secret before sharing this stack.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: queryforge
      POSTGRES_USER: queryforge
      POSTGRES_PASSWORD: ${QF_DB_PASSWORD:-queryforge}
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    ports:
      - "127.0.0.1:${QF_DB_PORT:-}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./db/migrations/V1__create_products.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/migrations:/workspace/db/migrations:ro
      - ./benchmark/seed:/seed:ro
      - ./scripts:/workspace/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryforge -d queryforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Backend API
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Set QF_SPRING_PROFILE=local-auth for the authenticated local stack.
      # The default remains the explicit, visibly documented development bypass.
      SPRING_PROFILES_ACTIVE: ${QF_SPRING_PROFILE:-default}
      DB_URL: jdbc:postgresql://db:5432/queryforge
      DB_USER: queryforge
      DB_PASSWORD: ${QF_DB_PASSWORD:-queryforge}
      SERVER_ADDRESS: 0.0.0.0
      QF_WEB_PORT: ${QF_WEB_PORT:-8080}
    ports:
      - "127.0.0.1:${QF_API_PORT:-8081}:8080"
    volumes:
      - ./benchmark/results:/app/benchmark/results
      - ./benchmark/runs:/app/benchmark/runs
      - ./docs/experiments:/app/docs/experiments:ro
    depends_on:
      db:
        condition: service_healthy

  # Frontend (Angular + nginx)
  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${QF_WEB_PORT:-8080}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Included only in the authenticated local environment. The imported realm is
  # versioned and contains deliberately local-only viewer/operator credentials.
  keycloak:
    profiles: ["authenticated"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${QF_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${QF_KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
      KC_PROXY_HEADERS: xforwarded
      # Keycloak is exposed browser-side under the /id/ path (same-origin with the SPA).
      # Tell it its relative path so every browser-facing URL keeps the /id/ prefix;
      # otherwise the login form posts to /realms/... and nginx returns 405.
      KC_HTTP_RELATIVE_PATH: /id/
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/queryforge-realm.json:/opt/keycloak/data/import/queryforge-realm.json:ro
      - keycloakdata:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /id/health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Local SMTP capture UI; it never relays mail beyond this Compose network.
  mailpit:
    profiles: ["monitoring"]
    image: axllent/mailpit:v1.26
    ports:
      - "127.0.0.1:${QF_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${QF_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      alertmanager:
        condition: service_started

  alertmanager:
    profiles: ["monitoring"]
    image: quay.io/prometheus/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.local.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      mailpit:
        condition: service_healthy

  data-generator:
    profiles: ["tools"]
    image: python:3.13-slim
    working_dir: /workspace
    entrypoint: ["python", "scripts/generate-data.py"]
    command: ["10000", "--csv", "benchmark/seed/products_seed42.csv"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./benchmark/seed:/workspace/benchmark/seed

volumes:
  pgdata:
  keycloakdata:
  prometheus_data:
  alertmanager_data:
