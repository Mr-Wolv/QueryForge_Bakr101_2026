<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar">
  <a class="brand" routerLink="/">QueryForge</a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
    <a routerLink="/experiments" routerLinkActive="active">Catalog</a>
    <a routerLink="/runs" routerLinkActive="active">Runs</a>
    <a routerLink="/compare" routerLinkActive="active">Compare</a>
  </nav>
  <button class="theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="themeLabel()">
    @if (theme.current === 'light') {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    } @else {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    }
  </button>
</header>

<main id="main" class="main">
  <router-outlet />
</main>
