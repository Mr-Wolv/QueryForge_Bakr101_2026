map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# When no upstream proxy supplies X-Forwarded-* (the local Compose stack), derive the
# external host and port from the browser's Host header. $host drops the port and
# $server_port is the container port (80), both of which corrupt the OAuth2 redirect_uri
# and make Keycloak reject the callback with "Invalid parameter: redirect_uri".
map $http_host $qf_forwarded_host {
    default     $http_host;
    ~^(.+):(\d+)$  $1;
}

map $http_host $qf_forwarded_port {
    default     "";
    ~^[^:]+:(\d+)$  $1;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $qf_forwarded_host;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ""      $qf_forwarded_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'" always;

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Authentication endpoints are intentionally proxied through the same origin as
    # the SPA so the browser session and CSRF cookie remain first-party.
    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /login/ {
        proxy_pass http://backend:8080/login/;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Available only in the authenticated local Compose profile. It keeps the
    # Keycloak issuer browser-reachable without exposing the container network.
    # Resolve at request time so the optional Keycloak profile is not required
    # for nginx to start with the unauthenticated app profile.
    location /id/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
