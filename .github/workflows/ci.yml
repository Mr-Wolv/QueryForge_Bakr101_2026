name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -ntp compile

      - name: Unit + functional tests (Testcontainers)
        run: mvn -B -ntp test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
      - run: npm test
        working-directory: frontend

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start production frontend for browser tests
        run: |
          docker run --detach --rm \
            --name queryforge-frontend-ci \
            --add-host backend:127.0.0.1 \
            --publish 127.0.0.1:4200:8080 \
            --volume "$GITHUB_WORKSPACE/frontend/dist/frontend/browser:/usr/share/nginx/html:ro" \
            --volume "$GITHUB_WORKSPACE/frontend/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4200/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs queryforge-frontend-ci
          exit 1

      - name: Test first-session flow
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4200
        run: npm run e2e:ci

      - name: Accessibility audit (axe-core)
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4200
        run: npx playwright test e2e/a11y.spec.ts

      - name: Stop production frontend test server
        if: always()
        run: docker stop queryforge-frontend-ci || true

      - name: Upload Playwright artifacts on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7


  default-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build backend
        run: ./mvnw -B -ntp package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start default Docker stack
        env:
          QF_DB_PASSWORD: ${{ secrets.QF_DB_PASSWORD || 'ci-local-password' }}
        run: |
          docker compose --profile app up -d --build
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile app logs backend --tail 50
          exit 1

      - name: Seed default dataset
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent -X POST "http://127.0.0.1:8081/api/lab/initialize?rows=10000" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run default-stack Playwright suite
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test e2e/default-stack.spec.ts

      - name: Upload Playwright artifacts on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-stack-playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Tear down Docker stack
        if: always()
        run: docker compose --profile app down -v || true

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate production Compose configuration
        run: |
          secrets_dir="$(mktemp -d)"
          trap 'rm -rf "$secrets_dir"' EXIT
          for name in postgres-admin app-db monitor-db oidc-client smtp; do
            : > "$secrets_dir/$name"
          done
          export QF_DOMAIN=queryforge.example.test
          export QF_ACME_EMAIL=ops@example.test
          export QF_OIDC_ISSUER_URI=https://id.example.test
          export QF_OIDC_CLIENT_ID=queryforge
          export QF_OIDC_CLIENT_SECRET_FILE="$secrets_dir/oidc-client"
          export QF_POSTGRES_ADMIN_PASSWORD_FILE="$secrets_dir/postgres-admin"
          export QF_APP_DB_PASSWORD_FILE="$secrets_dir/app-db"
          export QF_MONITOR_DB_PASSWORD_FILE="$secrets_dir/monitor-db"
          export QF_SMTP_HOST=smtp.example.test:587
          export QF_SMTP_FROM=queryforge@example.test
          export QF_SMTP_USERNAME=queryforge@example.test
          export QF_SMTP_PASSWORD_FILE="$secrets_dir/smtp"
          export QF_ALERT_EMAIL=ops@example.test
          docker compose -f docker-compose.production.yml config --quiet

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
