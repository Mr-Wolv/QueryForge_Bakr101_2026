name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: mvn -B -ntp compile

      - name: Unit + functional tests (Testcontainers)
        run: mvn -B -ntp test

      - name: Package (skips tests, already run)
        run: mvn -B -ntp -DskipTests package
