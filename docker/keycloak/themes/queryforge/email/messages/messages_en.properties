# QueryForge email theme messages
passwordResetSubject=Reset your QueryForge password
passwordResetBody=Hello ${user.firstName}${user.lastName?if_exists ""}!,\n\nYou requested a password reset for your QueryForge account. Use the link below to set a new password:\n\n${resetUrl}\n\nThis link will expire shortly. If you did not request this reset, you can ignore this email.\n\n— The QueryForge team
emailVerifySubject=Verify your QueryForge account
emailVerifyBody=Hello ${user.firstName}${user.lastName?if_exists ""}!,\n\nWelcome to QueryForge! Please verify your email address by clicking the link below:\n\n${verifyUrl}\n\n— The QueryForge team
